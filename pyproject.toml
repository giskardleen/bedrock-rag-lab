[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bedrock-rag-lab"
version = "0.1.0"
description = "Independent AWS Bedrock RAG learning and reference project"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]
live = [
    "boto3~=1.43.118",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
